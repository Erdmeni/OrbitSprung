name: Orbitsprung Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    name: Prüfen und testen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Release-Prüfung (keine Testversion in der App)
        run: node tests/release-check.mjs
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Playwright installieren
        # Robust gegen ausgefallene Ubuntu-Paketserver: apt wiederholt Downloads, jeder Versuch hat
        # höchstens 6 Minuten, es gibt zwei Versuche. Klappt es mit den Systempaketen nicht, wird nur der
        # Browser installiert (die fehlenden Pakete sind meist Schriften); die Tests danach zeigen, ob er läuft.
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          npm install --no-audit --no-fund
          for i in 1 2; do
            if timeout 360 npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Playwright mit Systempaketen fehlgeschlagen (Versuch $i), neuer Versuch in 20 s"
            sleep 20
            sudo apt-get update || true
          done
          echo "::warning::Systempakete nicht vollständig installierbar, installiere nur den Browser"
          npx playwright install chromium
      - name: Module zerlegen und zusammensetzen
        run: node tests/module.mjs
      - name: Smoke-Test (alle Modi, Shop, Einstellungen)
        run: node tests/smoke.mjs
      - name: Sync-Test (zwei Geräte, Staub-Buchführung)
        run: node tests/sync.mjs
      - name: Update-Hinweis-Test (neue Version, Ignorieren, nicht mehr anzeigen, ohne Netz)
        run: node tests/update.mjs

  build:
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version aus der Spieldatei lesen
        id: ver
        run: |
          VER=$(grep -oP "const APP_VERSION='\K[0-9.]+(?=')" app/src/main/assets/index.html)
          [ -n "$VER" ] || { echo "::error::APP_VERSION fehlt in index.html"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null; then
            echo "neu=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$VER gibt es schon. Für ein neues Release APP_VERSION und #ver erhöhen."
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!n}" ]; then echo "::error::Secret $n fehlt oder ist leer"; FEHLT=1; else echo "$n gesetzt"; fi
          done
          [ -z "$FEHLT" ] || exit 1
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "Keystore: $(wc -c < "$RUNNER_TEMP/release.jks") Bytes (erwartet 4306)"
      - name: APK bauen
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Orbitsprung.apk
      - name: Release veröffentlichen
        if: steps.ver.outputs.neu == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Orbitsprung ${{ steps.ver.outputs.version }}
          body: ${{ github.event.head_commit.message }}
          files: Orbitsprung.apk
          make_latest: true
